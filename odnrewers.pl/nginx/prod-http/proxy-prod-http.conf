# PROD: tymczasowe HTTP przed wystawieniem dwoch certyfikatow.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    location = /healthz {
        access_log off;
        return 200 "PROD HTTP proxy OK\n";
    }
    location / { return 404; }
}

server {
    listen 80;
    server_name www.odnrewers.pl rewers.edu.pl www.rewers.edu.pl;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 302 http://odnrewers.pl$request_uri; }
}

server {
    listen 80;
    server_name odnrewers.pl;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $panel_upstream http://panel:80;
    set $wordpress_upstream http://wordpress:80;
    client_max_body_size 512m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host odnrewers.pl;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host odnrewers.pl;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-Port 80;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location = /szkolenia {
        return 302 http://odnrewers.pl/szkolenia/$is_args$args;
    }
    location ^~ /szkolenia/ {
        proxy_pass $panel_upstream;
    }
    location / {
        proxy_pass $wordpress_upstream;
        proxy_read_timeout 300s;
    }
}
