# DEV: http://localhost:8080/szkolenia/
server {
    listen 80;
    server_name localhost;
    server_tokens off;
    absolute_redirect off;
    add_header X-Rewers-Environment DEV always;

    # Docker DNS: ponowne rozwiązanie adresu po odtworzeniu kontenera panelu.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $panel_upstream http://panel:80;
    set $wordpress_upstream http://wordpress:80;
    client_max_body_size 512m;

    location = /healthz {
        access_log off;
        return 200 "DEV proxy OK\n";
    }
    location = /szkolenia {
        return 308 /szkolenia/$is_args$args;
    }
    location /szkolenia/ {
        proxy_pass $panel_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass $wordpress_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

