# Etap przygotowania domeny panelu: HTTP-01 przed wlaczeniem HTTPS.
server {
    listen 80;
    server_name panel.odnrewers.pl;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://panel.odnrewers.pl$request_uri;
    }
}
