# PROD: celowo bez routingu aplikacji i bez wystawionych portów.
# Przed wdrożeniem trzeba ustalić routing, domeny oraz HTTPS.
server {
    listen 80;
    server_name _;
    server_tokens off;
    add_header X-Rewers-Environment PROD always;
    location = /healthz {
        access_log off;
        return 200 "PROD proxy configuration loaded; routing pending\n";
    }
    location / {
        return 503;
    }
}
