# PROD: reverse proxy dla odnrewers.pl.
# Dwa certyfikaty: odnrewers.pl + www.odnrewers.pl oraz rewers.edu.pl + www.rewers.edu.pl.
# Mounty podlaczone w compose.prod.yaml:
# - certyfikaty: /etc/letsencrypt (read-only)
# - katalog wyzwan ACME: /var/www/certbot (read-only dla Nginx)
# Nginx nie wystartuje bez obu certyfikatow i odpowiadajacych im kluczy.

# Wewnetrzny healthcheck Compose; obce domeny nie trafiaja do aplikacji.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    location = /healthz {
        access_log off;
        return 200 "PROD proxy OK\n";
    }
    location / {
        return 404;
    }
}

# HTTP: wyzwania Let's Encrypt oraz przekierowanie na adres kanoniczny.
server {
    listen 80;
    server_name odnrewers.pl www.odnrewers.pl;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://odnrewers.pl$request_uri;
    }
}

# Dawna domena: ACME bez przekierowania, pozostale adresy zachowuja sciezke i parametry.
server {
    listen 80;
    server_name rewers.edu.pl www.rewers.edu.pl;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://odnrewers.pl$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name rewers.edu.pl www.rewers.edu.pl;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/rewers.edu.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rewers.edu.pl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://odnrewers.pl$request_uri;
}

# HTTPS z www: certyfikat jest potrzebny takze przed przekierowaniem.
server {
    listen 443 ssl;
    http2 on;
    server_name www.odnrewers.pl;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/odnrewers.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/odnrewers.pl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 308 https://odnrewers.pl$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name odnrewers.pl;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/odnrewers.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/odnrewers.pl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PROD_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # DNS Dockera: odtworzenie kontenera nie wymaga stalego adresu IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $panel_upstream http://panel:80;
    set $wordpress_upstream http://wordpress:80;
    client_max_body_size 512m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host odnrewers.pl;
    proxy_set_header X-Real-IP $remote_addr;
    # Proxy jest publicznym wejsciem; nie ufamy naglowkom klienta.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host odnrewers.pl;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_hide_header X-Powered-By;

    location = /szkolenia {
        return 308 https://odnrewers.pl/szkolenia/$is_args$args;
    }

    # Zachowujemy prefiks /szkolenia/ wymagany przez panel React.
    location ^~ /szkolenia/ {
        proxy_pass $panel_upstream;
    }

    # Pliki ukryte (np. .env, .git, .htaccess); pozostaw .well-known.
    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    # Uploady sa danymi: nie przekazuj skryptow PHP do Apache.
    location ~* ^/wp-content/uploads/.*\.(?:php[0-9]*|phtml|pht|phar)(?:[./]|$) {
        return 404;
    }

    # Konfiguracja WordPressa, takze warianty kopii zapasowych.
    location ~* /wp-config(?:-sample)?\.php(?:[./~]|$) {
        return 404;
    }

    # Logi, zrzuty baz i typowe pliki tymczasowe/kopie edytorow.
    location ~* (?:\.(?:sql|dump|log)(?:\.(?:gz|bz2|xz|zip))?|\.(?:bak|backup|old|orig|save|swp|swo)|~)$ {
        return 404;
    }

    # Pozostalosci migracji i magazyny kopii WordPressa.
    location ~* ^/(?:dup-installer(?:/|$)|(?:[^/]+_)?installer(?:-backup)?\.php(?:/|$)|[^/]+_archive\.(?:zip|daf)$|[^/]+\.daf$|wp-content/(?:backups-dup-pro|backups-dup-lite|updraft|ai1wm-backups)(?:/|$)) {
        return 404;
    }

    # WordPress, jego pliki, REST API i wp-admin.
    # WordPress musi rozpoznawac HTTPS za proxy przez X-Forwarded-Proto.
    location / {
        proxy_pass $wordpress_upstream;
        proxy_read_timeout 300s;
    }
}
