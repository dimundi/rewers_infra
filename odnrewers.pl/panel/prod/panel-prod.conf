# PROD: wewnętrzny serwer plików panelu pod panel.odnrewers.pl.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /srv/panel/szkolenia;
    index index.html;
    absolute_redirect off;

    # Brakujący plik JS/CSS musi zwracać 404, a nie HTML aplikacji.
    location /static/ {
        try_files $uri =404;
    }
    location ~* \.(?:js|css|map|json|ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|pdf|mp4)$ {
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    # Trasy klienta React (np. login) oraz ich odświeżanie.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
