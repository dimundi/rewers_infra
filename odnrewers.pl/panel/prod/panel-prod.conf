# PROD: wewnętrzny serwer plików panelu; publiczny routing pozostaje do ustalenia.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /srv/panel;
    index index.html;
    absolute_redirect off;

    location = /szkolenia {
        return 308 /szkolenia/$is_args$args;
    }

    # Brakujący plik JS/CSS musi zwracać 404, a nie HTML aplikacji.
    location /szkolenia/static/ {
        try_files $uri =404;
    }
    location ~* ^/szkolenia/.*\.(?:js|css|map|json|ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|pdf|mp4)$ {
        try_files $uri =404;
    }
    location = /szkolenia/index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    # Trasy klienta React (np. login) oraz ich odświeżanie.
    location /szkolenia/ {
        try_files $uri $uri/ /szkolenia/index.html;
    }
    location / {
        return 404;
    }
}
