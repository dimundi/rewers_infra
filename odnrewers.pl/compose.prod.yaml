# PROD HTTPS: wymaga dwoch certyfikatow w certbot/conf.
name: odnrewer-pl-prod
services:
  panel:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/index.html"]
    volumes:
      - type: bind
        source: ${PROD_PANEL_BUILD_DIR:?Ustaw PROD_PANEL_BUILD_DIR w .env.prod}
        target: /srv/panel/szkolenia
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./panel/prod
        target: /etc/nginx/conf.d
        read_only: true
        bind:
          create_host_path: false
  proxy:
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ./nginx/prod
        target: /etc/nginx/conf.d
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./certbot/conf
        target: /etc/letsencrypt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./certbot/www
        target: /var/www/certbot
        read_only: true
        bind:
          create_host_path: false
  wordpress:
    # PROD: PHP 8.3.36, obraz zweryfikowany po poprawkach bezpieczenstwa.
    image: wordpress:php8.3-apache@sha256:e5a724ec7ad9055f48b2941ac1b674b08e77ed60edb8937a6254fb89ec45ddf7
    restart: unless-stopped
    networks:
      - wordpress_egress
    volumes:
      - type: bind
        source: ./wordpress/prod/www
        target: /var/www/html
        bind:
          create_host_path: false
      - type: bind
        source: ./wordpress/prod/php.ini
        target: /usr/local/etc/php/conf.d/zz-rewers.ini
        read_only: true
        bind:
          create_host_path: false
  wordpress-db:
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${PROD_WP_DB_NAME:?Ustaw PROD_WP_DB_NAME w .env.prod}
      MARIADB_USER: ${PROD_WP_DB_USER:?Ustaw PROD_WP_DB_USER w .env.prod}
      MARIADB_PASSWORD: ${PROD_WP_DB_PASSWORD:?Ustaw PROD_WP_DB_PASSWORD w .env.prod}
      MARIADB_ROOT_PASSWORD: ${PROD_WP_DB_ROOT_PASSWORD:?Ustaw PROD_WP_DB_ROOT_PASSWORD w .env.prod}
networks:
  wordpress_egress: {}
